services:
  - type: web
    name: voiceai-demo
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_ENABLED
        value: "false"
      - key: VOICEAI_RUNTIME_MODE
        value: live
      - key: VOICEAI_SPEECH_MODE
        value: cloud
      - key: VOICEAI_PUBLIC_LIVE
        value: "false"
      - key: VOICEAI_LEGACY_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: VOICEAI_REQUIRE_MONGODB
        value: "true"
      - key: MONGODB_DB_NAME
        value: voiceai_demo
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
