services:
  voiceai:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8000
      VOICEAI_DATA_DIR: /app/data
      VOICEAI_RUNTIME_MODE: demo
      VOICEAI_LEGACY_DEMO: 'false'
      MONGODB_URI: ''
      REDIS_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GROQ_API_KEY: ''
      CARTESIA_API_KEY: ''
      DEEPGRAM_API_KEY: ''
    volumes:
      - voiceai_demo_data:/app/data
    expose:
      - '8000'
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - voiceai
volumes:
  voiceai_demo_data:
