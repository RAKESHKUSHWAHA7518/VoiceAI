[project]
name = "voiceai"
version = "0.1.0"
description = "Real-Time Multimodal Voice Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "onnxruntime>=1.18.0",
    "deepgram-sdk>=3.0.0",
    "openai>=1.30.0",
    "cartesia>=1.0.0",
    "elevenlabs>=0.2.26",
    "kokoro>=0.9.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langfuse>=2.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "livekit-api>=1.0.0",
    "twilio>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["server"]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "locust>=2.30.0",
    "faster-whisper>=1.0.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "locust>=2.30.0",
    "faster-whisper>=1.0.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "W", "C4", "PT", "PTH", "RUF", "SIM", "T20", "ARG", "COM", "PIE", "PL", "TRY", "NPY"]
lint.ignore = ["S101", "T201", "T203"]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"