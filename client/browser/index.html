<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAI Test Client</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; border: none; border-radius: 4px; background: #2563eb; color: white; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        button.danger { background: #dc2626; }
        .status { padding: 0.75rem; border-radius: 4px; background: #f1f5f9; font-family: monospace; font-size: 0.875rem; min-height: 1.5rem; }
        .logs { max-height: 300px; overflow-y: auto; background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 4px; font-family: monospace; font-size: 0.75rem; }
        .log-entry { margin: 0.25rem 0; }
        .log-sent { color: #60a5fa; }
        .log-recv { color: #4ade80; }
        .log-error { color: #f87171; }
        .waveform { height: 100px; background: #1e293b; border-radius: 4px; margin-top: 1rem; position: relative; }
        .waveform canvas { width: 100%; height: 100%; display: block; }
        .latency { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .latency-item { background: #fef3c7; padding: 0.5rem 1rem; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>VoiceAI Test Client</h1>
    <div class="controls">
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        <button id="interruptBtn" onclick="sendInterrupt()" disabled class="danger">Interrupt (Barge-in)</button>
        <button id="pingBtn" onclick="sendPing()" disabled>Ping</button>
    </div>
    <div class="status" id="status">Disconnected</div>
    <div class="latency">
        <div class="latency-item">E2E: <span id="e2eLatency">-</span>ms</div>
        <div class="latency-item">RTT: <span id="rttLatency">-</span>ms</div>
    </div>
    <div class="waveform">
        <canvas id="waveformCanvas"></canvas>
    </div>
    <div class="logs" id="logs"></div>

    <script>
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let workletNode = null;
        let playbackContext = null;
        let playbackQueue = [];
        let isPlaying = false;
        let sequence = 0;
        const FRAME_TYPE = { AUDIO: 0x01, CONTROL: 0x02, PING: 0x03, PONG: 0x04 };
        const CONTROL_TYPE = {
            START_SPEAKING: 'start_speaking',
            STOP_SPEAKING: 'stop_speaking',
            INTERRUPT: 'interrupt',
            FLUSH_BUFFER: 'flush_buffer',
            PING: 'ping',
            PONG: 'pong',
            SESSION_START: 'session_start',
            SESSION_END: 'session_end',
            ERROR: 'error',
            TRANSCRIPT: 'transcript'
        };
        let sessionStartTime = 0;
        let lastPingTime = 0;
        let waveformCanvas = document.getElementById('waveformCanvas');
        let waveformCtx = null;
        let audioBuffer = [];

        function log(msg, type = 'recv') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toISOString().slice(11, 23)}] ${msg}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        function updateLatency(e2e, rtt) {
            if (e2e !== undefined) document.getElementById('e2eLatency').textContent = e2e.toFixed(1);
            if (rtt !== undefined) document.getElementById('rttLatency').textContent = rtt.toFixed(1);
        }

        function initWaveform() {
            waveformCtx = waveformCanvas.getContext('2d');
            resizeWaveform();
            window.addEventListener('resize', resizeWaveform);
            drawWaveform();
        }

        function resizeWaveform() {
            waveformCanvas.width = waveformCanvas.offsetWidth * window.devicePixelRatio;
            waveformCanvas.height = waveformCanvas.offsetHeight * window.devicePixelRatio;
            waveformCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function drawWaveform() {
            if (!waveformCtx) return;
            const ctx = waveformCtx;
            const w = waveformCanvas.width / window.devicePixelRatio;
            const h = waveformCanvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const step = w / Math.max(audioBuffer.length, 1);
            audioBuffer.forEach((val, i) => {
                const x = i * step;
                const y = h / 2 + val * h / 4;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            requestAnimationFrame(drawWaveform);
        }

        function pushAudioSample(val) {
            audioBuffer.push(val);
            if (audioBuffer.length > 500) audioBuffer.shift();
        }

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

            // Register audio worklet for capture
            await audioContext.audioWorklet.addModule('data:application/javascript,' + encodeURIComponent(`
                class CaptureProcessor extends AudioWorkletProcessor {
                    constructor() { super(); this.chunkSize = 480; this.buffer = []; }
                    process(inputs) {
                        const input = inputs[0];
                        if (input.length > 0) {
                            const channel = input[0];
                            for (let i = 0; i < channel.length; i++) {
                                this.buffer.push(channel[i]);
                                if (this.buffer.length >= this.chunkSize) {
                                    const chunk = new Float32Array(this.buffer);
                                    this.port.postMessage(chunk);
                                    this.buffer = [];
                                }
                            }
                        }
                        return true;
                    }
                }
                registerProcessor('capture-processor', CaptureProcessor);
            `));

            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            const source = audioContext.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioContext, 'capture-processor');
            workletNode.port.onmessage = (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    // Convert float32 to PCM16
                    const pcm16 = new Int16Array(e.data.length);
                    for (let i = 0; i < e.data.length; i++) {
                        const s = Math.max(-1, Math.min(1, e.data[i]));
                        pcm16[i] = s < 0 ? s * 32768 : s * 32767;
                    }
                    // Visualize
                    pushAudioSample(e.data[0] || 0);
                    // Send binary frame: [0x01][seq:4][len:4][audio]
                    const header = new Uint8Array(9);
                    header[0] = FRAME_TYPE.AUDIO;
                    new DataView(header.buffer).setUint32(1, sequence++, false);
                    new DataView(header.buffer).setUint32(5, pcm16.byteLength, false);
                    const frame = new Uint8Array(header.byteLength + pcm16.byteLength);
                    frame.set(header);
                    frame.set(new Uint8Array(pcm16.buffer), header.byteLength);
                    ws.send(frame);
                }
            };
            source.connect(workletNode);
            workletNode.connect(audioContext.destination);

            log('Audio initialized (16kHz mono, 30ms chunks)');
        }

        async function connect() {
            if (ws) return;
            try {
                await initAudio();
                ws = new WebSocket(`ws://${location.host}/ws`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    log('Connected to server');
                    setStatus('Connected - Speak to test');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    document.getElementById('interruptBtn').disabled = false;
                    document.getElementById('pingBtn').disabled = false;
                    sessionStartTime = performance.now();
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        handleBinaryFrame(event.data);
                    }
                };

                ws.onclose = () => {
                    log('Disconnected');
                    setStatus('Disconnected');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('interruptBtn').disabled = true;
                    document.getElementById('pingBtn').disabled = true;
                    ws = null;
                };

                ws.onerror = (err) => {
                    log('WebSocket error: ' + err.message, 'error');
                };
            } catch (e) {
                log('Connection failed: ' + e.message, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (playbackContext) {
                playbackContext.close();
                playbackContext = null;
            }
        }

        function handleBinaryFrame(data) {
            const view = new DataView(data);
            if (data.byteLength < 6) return;
            const frameType = view.getUint8(0);
            const seq = view.getUint32(1, false);
            const payloadLen = view.getUint32(5, false);

            if (frameType === FRAME_TYPE.AUDIO) {
                // Playback audio
                const audioData = new Int16Array(data, 9, payloadLen / 2);
                playAudio(audioData);
            } else if (frameType === FRAME_TYPE.CONTROL) {
                const payload = new TextDecoder().decode(new Uint8Array(data, 9, payloadLen));
                try {
                    const control = JSON.parse(payload);
                    handleControlFrame(control);
                } catch (e) {
                    log('Invalid control JSON: ' + e.message, 'error');
                }
            }
        }

        function handleControlFrame(control) {
            const type = control.type;
            const payload = control.payload || {};

            switch (type) {
                case CONTROL_TYPE.SESSION_START:
                    log(`Session started: ${payload.session_id}`);
                    break;
                case CONTROL_TYPE.TRANSCRIPT:
                    log(`Transcript: ${payload.text} (final: ${payload.is_final})`);
                    break;
                case CONTROL_TYPE.FLUSH_BUFFER:
                    log('FLUSH_BUFFER received - stopping playback');
                    stopPlayback();
                    break;
                case CONTROL_TYPE.PONG:
                    const rtt = performance.now() - lastPingTime;
                    updateLatency(undefined, rtt);
                    log(`Pong received (RTT: ${rtt.toFixed(1)}ms)`);
                    break;
                case CONTROL_TYPE.ERROR:
                    log(`Server error: ${payload.message}`, 'error');
                    break;
            }
        }

        function sendControl(type, payload = {}) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const control = { type, payload };
            const payloadBytes = new TextEncoder().encode(JSON.stringify(control));
            const frame = new Uint8Array(9 + payloadBytes.length);
            frame[0] = FRAME_TYPE.CONTROL;
            new DataView(frame.buffer).setUint32(1, sequence++, false);
            new DataView(frame.buffer).setUint32(5, payloadBytes.length, false);
            frame.set(payloadBytes, 9);
            ws.send(frame);
            log(`Sent ${type}`, 'sent');
        }

        function sendInterrupt() {
            sendControl(CONTROL_TYPE.INTERRUPT);
        }

        function sendPing() {
            lastPingTime = performance.now();
            sendControl(CONTROL_TYPE.PING);
        }

        function playAudio(pcm16) {
            if (!playbackContext) return;
            // Convert to float32
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }
            const buffer = playbackContext.createBuffer(1, float32.length, 24000);
            buffer.copyToChannel(float32, 0);
            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);
            source.start();
        }

        function stopPlayback() {
            // In real impl, we'd stop the current source
        }

        // Init
        initWaveform();
    </script>
</body>
</html>
